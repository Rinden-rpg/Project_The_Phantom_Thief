<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Miku 控制</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #f0f0f0;
            touch-action: none; /* 防止页面滚动和缩放 */
            user-select: none;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        #miku {
            position: absolute;
            width: 50px; /* 立绘宽度，可根据实际图片大小在此调整 */
            height: auto;
            /* 严格在 CSS 中锚定中心点，保持移动干脆，无过渡动画 */
            transform: translate(-50%, -50%); 
        }
        #joystick {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 150px;
            height: 150px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            gap: 5px;
            /* 加固防浏览器默认滚动/手势 */
            touch-action: none; 
        }
        .joy-btn {
            width: 100%;
            height: 100%;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            /* 防止拖拽图片触发浏览器默认行为 */
            pointer-events: none; 
        }
        #btn-up { grid-column: 2; grid-row: 1; background-image: url('up_01.png.PNG'); }
        #btn-left { grid-column: 1; grid-row: 2; background-image: url('left_01.png.PNG'); }
        #btn-middle { grid-column: 2; grid-row: 2; background-image: url('middle.png.PNG'); }
        #btn-right { grid-column: 3; grid-row: 2; background-image: url('right_01.png.PNG'); }
        #btn-down { grid-column: 2; grid-row: 3; background-image: url('down_01.png.PNG'); }
    </style>
</head>
<body>

<div id="game-container">
    <img id="miku" src="miku_01.png.PNG" alt="Miku" draggable="false">
    
    <!-- 摇杆作为一个整体监听触摸与鼠标拖动 -->
    <div id="joystick">
        <div></div>
        <div id="btn-up" class="joy-btn"></div>
        <div></div>
        <div id="btn-left" class="joy-btn"></div>
        <div id="btn-middle" class="joy-btn"></div>
        <div id="btn-right" class="joy-btn"></div>
        <div></div>
        <div id="btn-down" class="joy-btn"></div>
        <div></div>
    </div>
</div>

<script>
    const miku = document.getElementById('miku');
    const joystick = document.getElementById('joystick');
    const btnUp = document.getElementById('btn-up');
    const btnDown = document.getElementById('btn-down');
    const btnLeft = document.getElementById('btn-left');
    const btnRight = document.getElementById('btn-right');
    
    // 角色初始位置和速度 (坐标代表中心点)
    let mikuX = window.innerWidth / 2;
    let mikuY = window.innerHeight / 2;
    const speed = 5;

    // 区分键盘和摇杆的输入状态
    const keyboardInputs = { w: false, a: false, s: false, d: false };
    const joystickInputs = { w: false, a: false, s: false, d: false };
    
    // 鼠标拖动状态（桌面端兼容）
    let isJoystickDragging = false;

    // 初始化 Miku 位置
    miku.style.left = mikuX + 'px';
    miku.style.top = mikuY + 'px';

    // 更新角色位置的主循环
    function updatePosition() {
        let dx = 0;
        let dy = 0;

        // 结合键盘和摇杆的输入
        if (keyboardInputs.w || joystickInputs.w) dy -= speed;
        if (keyboardInputs.s || joystickInputs.s) dy += speed;
        if (keyboardInputs.a || joystickInputs.a) dx -= speed;
        if (keyboardInputs.d || joystickInputs.d) dx += speed;

        // 处理斜向移动的速度（归一化）
        if (dx !== 0 && dy !== 0) {
            const length = Math.sqrt(dx * dx + dy * dy);
            dx = (dx / length) * speed;
            dy = (dy / length) * speed;
        }

        mikuX += dx;
        mikuY += dy;

        // 动态读取图片宽高的一半，取代硬编码的 25px (防止图片未加载时报错，设定默认值25)
        const halfWidth = (miku.offsetWidth / 2) || 25;
        const halfHeight = (miku.offsetHeight / 2) || 25;

        // 边界限制
        mikuX = Math.max(halfWidth, Math.min(window.innerWidth - halfWidth, mikuX));
        mikuY = Math.max(halfHeight, Math.min(window.innerHeight - halfHeight, mikuY));

        // 仅修改 left 和 top，不覆盖 CSS 里的 transform
        miku.style.left = mikuX + 'px';
        miku.style.top = mikuY + 'px';

        requestAnimationFrame(updatePosition);
    }
    updatePosition();

    // --- 键盘事件监听 ---
    window.addEventListener('keydown', (e) => {
        const key = e.key.toLowerCase();
        if (keyboardInputs.hasOwnProperty(key)) {
            keyboardInputs[key] = true;
        }
    });

    window.addEventListener('keyup', (e) => {
        const key = e.key.toLowerCase();
        if (keyboardInputs.hasOwnProperty(key)) {
            keyboardInputs[key] = false;
        }
    });

    // --- 摇杆视觉与逻辑核心 ---
    function resetJoystickVisuals() {
        btnUp.style.backgroundImage = "url('up_01.png.PNG')";
        btnDown.style.backgroundImage = "url('down_01.png.PNG')";
        btnLeft.style.backgroundImage = "url('left_01.png.PNG')";
        btnRight.style.backgroundImage = "url('right_01.png.PNG')";
    }

    // 统合坐标计算逻辑（支持 Touch 与 Mouse）
    function calculateJoystickInput(clientX, clientY) {
        const rect = joystick.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;

        const deltaX = clientX - centerX;
        const deltaY = clientY - centerY;

        const deadZone = 15;
        
        joystickInputs.w = false;
        joystickInputs.s = false;
        joystickInputs.a = false;
        joystickInputs.d = false;
        resetJoystickVisuals();

        if (Math.abs(deltaX) < deadZone && Math.abs(deltaY) < deadZone) {
            return;
        }

        if (deltaY < -deadZone) {
            joystickInputs.w = true;
            btnUp.style.backgroundImage = "url('up_02.png.PNG')";
        }
        if (deltaY > deadZone) {
            joystickInputs.s = true;
            btnDown.style.backgroundImage = "url('down_02.png.PNG')";
        }
        if (deltaX < -deadZone) {
            joystickInputs.a = true;
            btnLeft.style.backgroundImage = "url('left_02.png.PNG')";
        }
        if (deltaX > deadZone) {
            joystickInputs.d = true;
            btnRight.style.backgroundImage = "url('right_02.png.PNG')";
        }
    }

    // --- 移动端触控监听 ---
    function handleJoystickTouch(e) {
        e.preventDefault();
        if (e.touches.length === 0) return;
        calculateJoystickInput(e.touches[0].clientX, e.touches[0].clientY);
    }

    function clearJoystickInput(e) {
        if(e) e.preventDefault();
        isJoystickDragging = false;
        joystickInputs.w = false;
        joystickInputs.s = false;
        joystickInputs.a = false;
        joystickInputs.d = false;
        resetJoystickVisuals();
    }

    joystick.addEventListener('touchstart', handleJoystickTouch, { passive: false });
    joystick.addEventListener('touchmove', handleJoystickTouch, { passive: false });
    joystick.addEventListener('touchend', clearJoystickInput, { passive: false });
    joystick.addEventListener('touchcancel', clearJoystickInput, { passive: false });

    // --- 桌面端鼠标监听 (兼容 PC 端测试游玩) ---
    joystick.addEventListener('mousedown', (e) => {
        e.preventDefault();
        isJoystickDragging = true;
        calculateJoystickInput(e.clientX, e.clientY);
    });

    // 绑定到 document 防止鼠标滑出摇杆范围时丢失监听
    document.addEventListener('mousemove', (e) => {
        if (!isJoystickDragging) return;
        e.preventDefault();
        calculateJoystickInput(e.clientX, e.clientY);
    }, { passive: false });

    document.addEventListener('mouseup', (e) => {
        if (!isJoystickDragging) return;
        clearJoystickInput(e);
    });

    // TODO: 之后可在此处继续添加立绘切换、存档、BGM 按钮等扩展功能
</script>

</body>
</html>
