<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Project: The Phantom Thief — Demo</title>
<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        overflow: hidden;
        background-color: #f0f0f0;
        touch-action: none;
        user-select: none;
    }

    #game-container {
        position: relative;
        width: 100vw;
        height: 100vh;
    }

    /* 动态生成的背景画布，铺满全屏，放在最底层 */
    #game-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        z-index: 1;
    }

    /* 人物：【修复模糊】强制像素渲染，关闭浏览器抗锯齿和渲染插值 */
    #miku {
        position: absolute;
        left: 50% !important;
        top: 50% !important;
        width: 160px;
        height: auto;
        transform: translate(-50%, -50%) scale(2.5);
        transform-origin: center;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        /* 防模糊关键新增 */
        -ms-interpolation-mode: nearest-neighbor;
        backface-visibility: hidden;
        z-index: 10;
    }

    /* 摇杆定位锚点 */
    #joy-center {
        position: absolute;
        left: 400px;
        bottom: 350px;
        width: 0;
        height: 0;
        z-index: 20;
    }

    .joy-btn {
        position: absolute;
        width: 150px;
        height: 150px;
        transform: translate(-50%, -50%) scale(5);
        transform-origin: center;
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        -ms-interpolation-mode: nearest-neighbor;
        backface-visibility:hidden;
        pointer-events: auto;
    }

    #btn-up    { left: 0;      top: -200; background-image: url('up_01.png.PNG'); }
    #btn-left  { left: -200; top: 0;      background-image: url('left_01.png.PNG'); }
    #btn-middle{ left: 0;      top: 0;      background-image: url('middle.png.PNG'); }
    #btn-right { left: 200;  top: 0;      background-image: url('right_01.png.PNG'); }
    #btn-down  { left: 0;      top: 200;  background-image: url('down_01.png.PNG'); }

</style>
</head>
<body>

<div id="game-container">
    <canvas id="game-canvas"></canvas>
    <img id="miku" src="miku_01.png.PNG" alt="Miku" draggable="false">

    <div id="joy-center">
        <div id="btn-up" class="joy-btn"></div>
        <div id="btn-left" class="joy-btn"></div>
        <div id="btn-middle" class="joy-btn"></div>
        <div id="btn-right" class="joy-btn"></div>
        <div id="btn-down" class="joy-btn"></div>
    </div>
</div>

<script>
    // --- 1. 画布与自适应设置 ---
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    ctx.webkitImageSmoothingEnabled = false;

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // --- 2. 图像资源加载与昼夜循环系统 ---
    const assets = {
        dayFloor: new Image(), nightFloor: new Image()
    };
    assets.dayFloor.src = 'stone_floor_01.PNG';
    assets.nightFloor.src = 'stone_floor_night_01.PNG';

    let isNight = false;
    // 每 10 分钟自动切换昼夜
    setInterval(() => { isNight = !isNight; }, 10 * 60 * 1000);

    // --- 3. 渲染核心与地图范围设置 ---
    const TILE_SIZE = 57; // 1个地砖单位大小为57px
    const MAP_TILES = 1000; // 地砖地图限定为 1000x1000 块
    const MAP_SIZE = MAP_TILES * TILE_SIZE; // 总像素宽度/高度 (57000px)

    // 默认初始出生点设置在 1000x1000 地图的正中央
    let cameraX = MAP_SIZE / 2;
    let cameraY = MAP_SIZE / 2;
    const speed = 5;

    // 伪随机函数
    function pseudoRandom(x, y) {
        let n = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453123;
        return n - Math.floor(n);
    }

    function renderMap() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const currentFloor = isNight ? assets.nightFloor : assets.dayFloor;

        // 计算当前屏幕覆盖的地砖网格范围
        const startTileX = Math.floor((cameraX - canvas.width / 2) / TILE_SIZE) - 2;
        const endTileX = Math.ceil((cameraX + canvas.width / 2) / TILE_SIZE) + 2;
        const startTileY = Math.floor((cameraY - canvas.height / 2) / TILE_SIZE) - 2;
        const endTileY = Math.ceil((cameraY + canvas.height / 2) / TILE_SIZE) + 2;

        // A. 铺满基础地砖（严格限制在 0 ~ 999 块地砖范围内）
        for (let tx = startTileX; tx <= endTileX; tx++) {
            if (tx < 0 || tx >= MAP_TILES) continue;
            for (let ty = startTileY; ty <= endTileY; ty++) {
                if (ty < 0 || ty >= MAP_TILES) continue;
                
                const screenX = tx * TILE_SIZE - cameraX + canvas.width / 2;
                const screenY = ty * TILE_SIZE - cameraY + canvas.height / 2;
                if (currentFloor.complete) {
                    ctx.drawImage(currentFloor, screenX, screenY, TILE_SIZE, TILE_SIZE);
                }
            }
        }
    }

    // --- 4. 移动与输入逻辑 ---
    const joyCenter = document.getElementById('joy-center');
    const btnUp = document.getElementById('btn-up');
    const btnDown = document.getElementById('btn-down');
    const btnLeft = document.getElementById('btn-left');
    const btnRight = document.getElementById('btn-right');

    const keyboardInputs = { w: false, a: false, s: false, d: false };
    const joystickInputs = { w: false, a: false, s: false, d: false };
    let isJoystickDragging = false;

    // 主游戏循环
    function gameLoop() {
        let dx = 0;
        let dy = 0;

        if (keyboardInputs.w || joystickInputs.w) dy -= speed;
        if (keyboardInputs.s || joystickInputs.s) dy += speed;
        if (keyboardInputs.a || joystickInputs.a) dx -= speed;
        if (keyboardInputs.d || joystickInputs.d) dx += speed;

        if (dx !== 0 && dy !== 0) {
            const length = Math.sqrt(dx * dx + dy * dy);
            dx = (dx / length) * speed;
            dy = (dy / length) * speed;
        }

        // 摄像机坐标移动
        cameraX += dx;
        cameraY += dy;

        // 【边界死锁逻辑】：限制角色坐标不能超出 0 ~ 1000*57px 的范围，撞墙后只能向反方向走
        cameraX = Math.max(0, Math.min(MAP_SIZE, cameraX));
        cameraY = Math.max(0, Math.min(MAP_SIZE, cameraY));

        // 渲染每一帧
        renderMap();
        requestAnimationFrame(gameLoop);
    }
    gameLoop();

    // 键盘监听
    window.addEventListener('keydown', (e) => {
        const key = e.key.toLowerCase();
        if (keyboardInputs.hasOwnProperty(key)) {
            keyboardInputs[key] = true;
        }
    });

    window.addEventListener('keyup', (e) => {
        const key = e.key.toLowerCase();
        if (keyboardInputs.hasOwnProperty(key)) {
            keyboardInputs[key] = false;
        }
    });

    // 摇杆控制保持原样
    function resetJoystickVisuals() {
        btnUp.style.backgroundImage = "url('up_01.png.PNG')";
        btnDown.style.backgroundImage = "url('down_01.png.PNG')";
        btnLeft.style.backgroundImage = "url('left_01.png.PNG')";
        btnRight.style.backgroundImage = "url('right_01.png.PNG')";
    }

    function calculateJoystickInput(clientX, clientY) {
        const rect = joyCenter.getBoundingClientRect();
        const centerX = rect.left;
        const centerY = rect.top;

        const deltaX = clientX - centerX;
        const deltaY = clientY - centerY;

        const triggerThreshold = 100;
        const deadZone = 30;

        joystickInputs.w = false;
        joystickInputs.s = false;
        joystickInputs.a = false;
        joystickInputs.d = false;
        resetJoystickVisuals();

        if (Math.abs(deltaX) < deadZone && Math.abs(deltaY) < deadZone) return;

        if (deltaY < -triggerThreshold) {
            joystickInputs.w = true;
            btnUp.style.backgroundImage = "url('up_02.png.PNG')";
        }
        if (deltaY > triggerThreshold) {
            joystickInputs.s = true;
            btnDown.style.backgroundImage = "url('down_02.png.PNG')";
        }
        if (deltaX < -triggerThreshold) {
            joystickInputs.a = true;
            btnLeft.style.backgroundImage = "url('left_02.png.PNG')";
        }
        if (deltaX > triggerThreshold) {
            joystickInputs.d = true;
            btnRight.style.backgroundImage = "url('right_02.png.PNG')";
        }
    }

    function handleJoystickTouch(e) {
        e.preventDefault();
        if (e.touches.length === 0) return;
        calculateJoystickInput(e.touches[0].clientX, e.touches[0].clientY);
    }

    function clearJoystickInput(e) {
        if(e) e.preventDefault();
        isJoystickDragging = false;
        joystickInputs.w = false;
        joystickInputs.s = false;
        joystickInputs.a = false;
        joystickInputs.d = false;
        resetJoystickVisuals();
    }

    document.addEventListener('touchstart', handleJoystickTouch, { passive: false });
    document.addEventListener('touchmove', handleJoystickTouch, { passive: false });
    document.addEventListener('touchend', clearJoystickInput, { passive: false });
    document.addEventListener('touchcancel', clearJoystickInput, { passive: false });

    document.addEventListener('mousedown', (e) => {
        e.preventDefault();
        isJoystickDragging = true;
        calculateJoystickInput(e.clientX, e.clientY);
    });

    document.addEventListener('mousemove', (e) => {
        if (!isJoystickDragging) return;
        e.preventDefault();
        calculateJoystickInput(e.clientX, e.clientY);
    }, { passive: false });

    document.addEventListener('mouseup', clearJoystickInput);

</script>
</body>
</html>
