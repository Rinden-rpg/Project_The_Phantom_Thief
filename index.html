<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Miku 控制</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #f0f0f0;
            touch-action: none; 
            user-select: none;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        #miku {
            position: absolute;
            /* === 🚀 核心像素级优化：放大时保持像素点清晰不模糊 === */
            image-rendering: crisp-edges;
            image-rendering: pixelated;
            
            /* 如果原图太小，你可以通过修改这里的宽度来等比例放大它 */
            /* 比如 64px, 96px, 128px 等（推荐用原图尺寸的整数倍） */
            width: 96px; 
            height: auto;
            transform: translate(-50%, -50%); 
        }
        #joystick {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 180px; 
            height: 180px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            gap: 5px;
            touch-action: none; 
        }
        .joy-btn {
            width: 100%;
            height: 100%;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            pointer-events: none;
            /* 摇杆图片如果是像素风，也可以开启防模糊 */
            image-rendering: pixelated;
        }
        #btn-up { grid-column: 2; grid-row: 1; background-image: url('up_01.png.PNG'); }
        #btn-left { grid-column: 1; grid-row: 2; background-image: url('left_01.png.PNG'); }
        #btn-middle { grid-column: 2; grid-row: 2; background-image: url('middle.png.PNG'); }
        #btn-right { grid-column: 3; grid-row: 2; background-image: url('right_01.png.PNG'); }
        #btn-down { grid-column: 2; grid-row: 3; background-image: url('down_01.png.PNG'); }
    </style>
</head>
<body>

<div id="game-container">
    <img id="miku" src="miku_01.png.PNG" alt="Miku" draggable="false">
    
    <div id="joystick">
        <div></div>
        <div id="btn-up" class="joy-btn"></div>
        <div></div>
        <div id="btn-left" class="joy-btn"></div>
        <div id="btn-middle" class="joy-btn"></div>
        <div id="btn-right" class="joy-btn"></div>
        <div></div>
        <div id="btn-down" class="joy-btn"></div>
        <div></div>
    </div>
</div>

<script>
    const miku = document.getElementById('miku');
    const joystick = document.getElementById('joystick');
    const btnUp = document.getElementById('btn-up');
    const btnDown = document.getElementById('btn-down');
    const btnLeft = document.getElementById('btn-left');
    const btnRight = document.getElementById('btn-right');
    
    let mikuX = window.innerWidth / 2;
    let mikuY = window.innerHeight / 2;
    const speed = 4; // 针对像素小人稍微调慢一点速度，看起来移动更自然

    const keyboardInputs = { w: false, a: false, s: false, d: false };
    const joystickInputs = { w: false, a: false, s: false, d: false };
    let isJoystickDragging = false;

    miku.style.left = mikuX + 'px';
    miku.style.top = mikuY + 'px';

    function updatePosition() {
        let dx = 0;
        let dy = 0;

        if (keyboardInputs.w || joystickInputs.w) dy -= speed;
        if (keyboardInputs.s || joystickInputs.s) dy += speed;
        if (keyboardInputs.a || joystickInputs.a) dx -= speed;
        if (keyboardInputs.d || joystickInputs.d) dx += speed;

        if (dx !== 0 && dy !== 0) {
            const length = Math.sqrt(dx * dx + dy * dy);
            dx = (dx / length) * speed;
            dy = (dy / length) * speed;
        }

        mikuX += dx;
        mikuY += dy;

        const halfWidth = (miku.offsetWidth / 2) || 20;
        const halfHeight = (miku.offsetHeight / 2) || 20;

        mikuX = Math.max(halfWidth, Math.min(window.innerWidth - halfWidth, mikuX));
        mikuY = Math.max(halfHeight, Math.min(window.innerHeight - halfHeight, mikuY));

        miku.style.left = mikuX + 'px';
        miku.style.top = mikuY + 'px';

        requestAnimationFrame(updatePosition);
    }
    updatePosition();

    window.addEventListener('keydown', (e) => {
        const key = e.key.toLowerCase();
        if (keyboardInputs.hasOwnProperty(key)) keyboardInputs[key] = true;
    });

    window.addEventListener('keyup', (e) => {
        const key = e.key.toLowerCase();
        if (keyboardInputs.hasOwnProperty(key)) keyboardInputs[key] = false;
    });

    function resetJoystickVisuals() {
        btnUp.style.backgroundImage = "url('up_01.png.PNG')";
        btnDown.style.backgroundImage = "url('down_01.png.PNG')";
        btnLeft.style.backgroundImage = "url('left_01.png.PNG')";
        btnRight.style.backgroundImage = "url('right_01.png.PNG')";
    }

    function calculateJoystickInput(clientX, clientY) {
        const rect = joystick.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;

        const deltaX = clientX - centerX;
        const deltaY = clientY - centerY;

        const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
        const deadZone = 20; 
        
        joystickInputs.w = false;
        joystickInputs.s = false;
        joystickInputs.a = false;
        joystickInputs.d = false;
        resetJoystickVisuals();

        if (distance < deadZone) return;

        const angle = Math.atan2(deltaY, deltaX);

        if (angle >= -Math.PI * 5/8 && angle <= -Math.PI * 3/8) {
            joystickInputs.w = true; btnUp.style.backgroundImage = "url('up_02.png.PNG')";
        }
        else if (angle >= Math.PI * 3/8 && angle <= Math.PI * 5/8) {
            joystickInputs.s = true; btnDown.style.backgroundImage = "url('down_02.png.PNG')";
        }
        else if (angle >= Math.PI * 7/8 || angle <= -Math.PI * 7/8) {
            joystickInputs.a = true; btnLeft.style.backgroundImage = "url('left_02.png.PNG')";
        }
        else if (angle >= -Math.PI * 1/8 && angle <= Math.PI * 1/8) {
            joystickInputs.d = true; btnRight.style.backgroundImage = "url('right_02.png.PNG')";
        }
        else if (angle > -Math.PI * 7/8 && angle < -Math.PI * 5/8) {
            joystickInputs.w = true; joystickInputs.a = true;
            btnUp.style.backgroundImage = "url('up_02.png.PNG')"; btnLeft.style.backgroundImage = "url('left_02.png.PNG')";
        }
        else if (angle > -Math.PI * 3/8 && angle < -Math.PI * 1/8) {
            joystickInputs.w = true; joystickInputs.d = true;
            btnUp.style.backgroundImage = "url('up_02.png.PNG')"; btnRight.style.backgroundImage = "url('right_02.png.PNG')";
        }
        else if (angle > Math.PI * 5/8 && angle < Math.PI * 7/8) {
            joystickInputs.s = true; joystickInputs.a = true;
            btnDown.style.backgroundImage = "url('down_02.png.PNG')"; btnLeft.style.backgroundImage = "url('left_02.png.PNG')";
        }
        else if (angle > Math.PI * 1/8 && angle < Math.PI * 3/8) {
            joystickInputs.s = true; joystickInputs.d = true;
            btnDown.style.backgroundImage = "url('down_02.png.PNG')"; btnRight.style.backgroundImage = "url('right_02.png.PNG')";
        }
    }

    function clearJoystickInput(e) {
        if(e) e.preventDefault();
        isJoystickDragging = false;
        joystickInputs.w = false;
        joystickInputs.s = false;
        joystickInputs.a = false;
        joystickInputs.d = false;
        resetJoystickVisuals();
    }

    joystick.addEventListener('touchstart', handleJoystickTouch, { passive: false });
    joystick.addEventListener('touchmove', handleJoystickTouch, { passive: false });
    joystick.addEventListener('touchend', clearJoystickInput, { passive: false });
    joystick.addEventListener('touchcancel', clearJoystickInput, { passive: false });

    function handleJoystickTouch(e) {
        e.preventDefault();
        if (e.touches.length === 0) return;
        // 修正为准确获取第一根手指的坐标
        calculateJoystickInput(e.touches[0].clientX, e.touches[0].clientY);
    }

    joystick.addEventListener('mousedown', (e) => {
        e.preventDefault();
        isJoystickDragging = true;
        calculateJoystickInput(e.clientX, e.clientY);
    });

    document.addEventListener('mousemove', (e) => {
        if (!isJoystickDragging) return;
        e.preventDefault();
        calculateJoystickInput(e.clientX, e.clientY);
    }, { passive: false });

    document.addEventListener('mouseup', (e) => {
        if (!isJoystickDragging) return;
        clearJoystickInput(e);
    });

    window.addEventListener('resize', () => {
        const halfWidth = (miku.offsetWidth / 2) || 20;
        const halfHeight = (miku.offsetHeight / 2) || 20;
        mikuX = Math.max(halfWidth, Math.min(window.innerWidth - halfWidth, mikuX));
        mikuY = Math.max(halfHeight, Math.min(window.innerHeight - halfHeight, mikuY));
    });
</script>

</body>
</html>
