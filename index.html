<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Project: The Phantom Thief — Demo</title>
<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        overflow: hidden;
        background-color: #000; /* 外部留白变为黑边，类似电影模式 */
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100px;
        width: 100px;
        touch-action: none;
        user-select: none;
    }

    /* 固定为 3K 分辨率 (2880x2160)，4:3 横屏比例 */
    #game-container {
        position: relative;
        width: 3072px; 
        height: 2304px;
        background-color: #f0f0f0;
        overflow: hidden;
        transform-origin: center center; /* 从中心点进行缩放 */
    }

    /* 人物：锁死原样，一丝不动 */
    #miku {
        position: absolute;
        width: 160px;
        height: auto;
        transform: translate(-50%, -50%) scale(2.5);
        transform-origin: center;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
    }

    /* 摇杆定位锚点 = 四角星【中心】
       距离屏幕左边缘500px，距离屏幕下边缘500px，真实物理像素！ */
    #joy-center {
        position: absolute;
        left: 500px;
        bottom: 500px;
        width: 0;
        height: 0;
    }

    /* 每个按钮：
    - 布局原点是自己的中心
    - transform-origin:center; scale(5)只放大【画面，不改位置坐标】！！ */
    .joy-btn {
        position: absolute;
        width: 50px;
        height: 50px;
        transform: translate(-50%, -50%) scale(5);
        transform-origin: center;
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        /* 热区还是40px原始大小！视觉是放大的像素画 */
        pointer-events: auto;
    }

    /* ↓ 补全了单位 px，保持规范 */
    #btn-up    { left: 0;      top: -200px; background-image: url('up_01.png.PNG'); }
    #btn-left  { left: -200px; top: 0;      background-image: url('left_01.png.PNG'); }
    #btn-middle{ left: 0;      top: 0;      background-image: url('middle.png.PNG'); }
    #btn-right { left: 200px;  top: 0;      background-image: url('right_01.png.PNG'); }
    #btn-down  { left: 0;      top: 200px;  background-image: url('down_01.png.PNG'); }

</style>
</head>
<body>

<div id="game-container">
    <img id="miku" src="miku_01.png.PNG" alt="Miku" draggable="false">

    <div id="joy-center">
        <div id="btn-up" class="joy-btn"></div>
        <div id="btn-left" class="joy-btn"></div>
        <div id="btn-middle" class="joy-btn"></div>
        <div id="btn-right" class="joy-btn"></div>
        <div id="btn-down" class="joy-btn"></div>
    </div>
</div>

<script>
    // --- 屏幕缩放自适应逻辑 ---
    const GAME_WIDTH = 2880;
    const GAME_HEIGHT = 2160;
    let currentScale = 1;

    function resizeGame() {
        const scaleX = window.innerWidth / GAME_WIDTH;
        const scaleY = window.innerHeight / GAME_HEIGHT;
        currentScale = Math.min(scaleX, scaleY);
        document.getElementById('game-container').style.transform = `scale(${currentScale})`;
    }
    window.addEventListener('resize', resizeGame);
    resizeGame(); // 初始化调用

    // --- 游戏主逻辑 ---
    const miku = document.getElementById('miku');
    const joyCenter = document.getElementById('joy-center');
    const btnUp = document.getElementById('btn-up');
    const btnDown = document.getElementById('btn-down');
    const btnLeft = document.getElementById('btn-left');
    const btnRight = document.getElementById('btn-right');

    // 坐标相对于 3K 画布内部
    let mikuX = GAME_WIDTH / 2;
    let mikuY = GAME_HEIGHT / 2;
    // 提示：因为地图变成了3K分辨率，如果觉得5速度太慢，可以把 speed 调大（如 15~20）
    const speed = 5; 

    const keyboardInputs = { w: false, a: false, s: false, d: false };
    const joystickInputs = { w: false, a: false, s: false, d: false };
    let isJoystickDragging = false;

    miku.style.left = mikuX + 'px';
    miku.style.top = mikuY + 'px';

    function updatePosition() {
        let dx = 0;
        let dy = 0;

        if (keyboardInputs.w || joystickInputs.w) dy -= speed;
        if (keyboardInputs.s || joystickInputs.s) dy += speed;
        if (keyboardInputs.a || joystickInputs.a) dx -= speed;
        if (keyboardInputs.d || joystickInputs.d) dx += speed;

        if (dx !== 0 && dy !== 0) {
            const length = Math.sqrt(dx * dx + dy * dy);
            dx = (dx / length) * speed;
            dy = (dy / length) * speed;
        }

        mikuX += dx;
        mikuY += dy;

        const halfWidth = (miku.offsetWidth / 2) || 80;
        const halfHeight = (miku.offsetHeight / 2) || 80;

        // 边界限制现在基于 3K 固定画布大小，而非当前窗口大小
        mikuX = Math.max(halfWidth, Math.min(GAME_WIDTH - halfWidth, mikuX));
        mikuY = Math.max(halfHeight, Math.min(GAME_HEIGHT - halfHeight, mikuY));

        miku.style.left = mikuX + 'px';
        miku.style.top = mikuY + 'px';

        requestAnimationFrame(updatePosition);
    }
    updatePosition();

    window.addEventListener('keydown', (e) => {
        const key = e.key.toLowerCase();
        if (keyboardInputs.hasOwnProperty(key)) {
            keyboardInputs[key] = true;
        }
    });

    window.addEventListener('keyup', (e) => {
        const key = e.key.toLowerCase();
        if (keyboardInputs.hasOwnProperty(key)) {
            keyboardInputs[key] = false;
        }
    });

    function resetJoystickVisuals() {
        btnUp.style.backgroundImage = "url('up_01.png.PNG')";
        btnDown.style.backgroundImage = "url('down_01.png.PNG')";
        btnLeft.style.backgroundImage = "url('left_01.png.PNG')";
        btnRight.style.backgroundImage = "url('right_01.png.PNG')";
    }

    function calculateJoystickInput(clientX, clientY) {
        const rect = joyCenter.getBoundingClientRect();
        const centerX = rect.left;
        const centerY = rect.top;

        // 由于整个画布被缩放了，触发坐标需要除以 currentScale，转换回 3K 逻辑坐标系下
        const deltaX = (clientX - centerX) / currentScale;
        const deltaY = (clientY - centerY) / currentScale;

        const triggerThreshold = 100;
        const deadZone = 30;

        joystickInputs.w = false;
        joystickInputs.s = false;
        joystickInputs.a = false;
        joystickInputs.d = false;
        resetJoystickVisuals();

        if (Math.abs(deltaX) < deadZone && Math.abs(deltaY) < deadZone) return;

        if (deltaY < -triggerThreshold) {
            joystickInputs.w = true;
            btnUp.style.backgroundImage = "url('up_02.png.PNG')";
        }
        if (deltaY > triggerThreshold) {
            joystickInputs.s = true;
            btnDown.style.backgroundImage = "url('down_02.png.PNG')";
        }
        if (deltaX < -triggerThreshold) {
            joystickInputs.a = true;
            btnLeft.style.backgroundImage = "url('left_02.png.PNG')";
        }
        if (deltaX > triggerThreshold) {
            joystickInputs.d = true;
            btnRight.style.backgroundImage = "url('right_02.png.PNG')";
        }
    }

    function handleJoystickTouch(e) {
        e.preventDefault();
        if (e.touches.length === 0) return;
        calculateJoystickInput(e.touches[0].clientX, e.touches[0].clientY);
    }

    function clearJoystickInput(e) {
        if(e) e.preventDefault();
        isJoystickDragging = false;
        joystickInputs.w = false;
        joystickInputs.s = false;
        joystickInputs.a = false;
        joystickInputs.d = false;
        resetJoystickVisuals();
    }

    document.addEventListener('touchstart', handleJoystickTouch, { passive: false });
    document.addEventListener('touchmove', handleJoystickTouch, { passive: false });
    document.addEventListener('touchend', clearJoystickInput, { passive: false });
    document.addEventListener('touchcancel', clearJoystickInput, { passive: false });

    document.addEventListener('mousedown', (e) => {
        e.preventDefault();
        isJoystickDragging = true;
        calculateJoystickInput(e.clientX, e.clientY);
    });

    document.addEventListener('mousemove', (e) => {
        if (!isJoystickDragging) return;
        e.preventDefault();
        calculateJoystickInput(e.clientX, e.clientY);
    }, { passive: false });

    document.addEventListener('mouseup', clearJoystickInput);

</script>
</body>
</html>
