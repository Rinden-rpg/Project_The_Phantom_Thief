<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Project: The Phantom Thief — Demo</title>
<style>
    * {
        box-sizing: border-box;
        margin:0;
        padding:0;
    }

    body {
        overflow: hidden;
        background-color: #dddddd; /* 画布外的遮罩底色，和游戏#f0f0f0区分开 */
        touch-action: none;
        user-select: none;
        display:flex;
        justify-content:center;
        align-items:center;
        width:100vw;
        height:100vh;
    }

    /* ========== 硬性锁死 3:4 (宽:高 = 3:4)，基准3K：2160×2880 ========== */
    #game-container {
        position: relative;
        width: 2160px;
        height: 2880px;
        max-width: 100vw;
        max-height: 100vh;
        /* 自动等比缩小，不变形 */
        transform-origin: center center;
        background-color: #f0f0f0;
    }

    /* 人物：锁死原样，一丝不动 */
    #miku {
        position: absolute;
        width: 160px;
        height: auto;
        transform: translate(-50%, -50%) scale(2.5);
        transform-origin: center;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
    }

    /* 摇杆定位锚点 = 四角星【中心】
       距离**游戏画布**左边缘60px，距离**游戏画布**下边缘60px */
    #joy-center {
        position: absolute;
        left: 60px;
        bottom: 60px;
        width: 0;
        height: 0;
    }

    /* 摇杆交互热区：刚好包围全部方向按钮的布局范围 */
    #joy-hitbox {
        position: absolute;
        left: -200px;
        top: -200px;
        width: 401px;
        height: 401px;
        /* background:rgba(255,0,0,0.1); 取消注释可以可视化热区调试 */
    }

    /* 每个按钮：scale(5)只放大画面，不改位置坐标 */
    .joy-btn {
        position: absolute;
        width: 50px;
        height: 50px;
        transform: translate(-50%, -50%) scale(5);
        transform-origin: center;
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        pointer-events: auto;
    }

    /* 真实像素距离：四个箭头中心 ↔ 四角星中心严格200px */
    #btn-up    { left:0px;   top:-200px; background-image: url('up_01.png.PNG'); }
    #btn-left  { left:-200px;top:0px;     background-image: url('left_01.png.PNG'); }
    #btn-middle{ left:0px;   top:0px;     background-image: url('middle.png.PNG'); }
    #btn-right { left:200px; top:0px;     background-image: url('right_01.png.PNG'); }
    #btn-down  { left:0px;   top:200px;   background-image: url('down_01.png.PNG'); }

</style>
</head>
<body>

<div id="game-container">
    <img id="miku" src="miku_01.png.PNG" alt="Miku" draggable="false">

    <div id="joy-center">
        <div id="joy-hitbox"></div>
        <div id="btn-up" class="joy-btn"></div>
        <div id="btn-left" class="joy-btn"></div>
        <div id="btn-middle" class="joy-btn"></div>
        <div id="btn-right" class="joy-btn"></div>
        <div id="btn-down" class="joy-btn"></div>
    </div>
</div>

<script>
    const miku = document.getElementById('miku');
    const joyCenter = document.getElementById('joy-center');
    const joyHitbox = document.getElementById('joy-hitbox');
    const btnUp = document.getElementById('btn-up');
    const btnDown = document.getElementById('btn-down');
    const btnLeft = document.getElementById('btn-left');
    const btnRight = document.getElementById('btn-right');
    const gameContainer = document.getElementById("game-container");

    let mikuX = gameContainer.clientWidth / 2;
    let mikuY = gameContainer.clientHeight / 2;
    const speed = 5;

    const keyboardInputs = { w: false, a: false, s: false, d: false };
    const joystickInputs = { w: false, a: false, s: false, d: false };
    let isJoystickDragging = false;

    miku.style.left = mikuX + 'px';
    miku.style.top = mikuY + 'px';

    function updatePosition() {
        let dx = 0;
        let dy = 0;

        if (keyboardInputs.w || joystickInputs.w) dy -= speed;
        if (keyboardInputs.s || joystickInputs.s) dy += speed;
        if (keyboardInputs.a || joystickInputs.a) dx -= speed;
        if (keyboardInputs.d || joystickInputs.d) dx += speed;

        if (dx !== 0 && dy !== 0) {
            const length = Math.sqrt(dx * dx + dy * dy);
            dx = (dx / length) * speed;
            dy = (dy / length) * speed;
        }

        mikuX += dx;
        mikuY += dy;

        const halfWidth = (miku.offsetWidth / 2) || 80;
        const halfHeight = (miku.offsetHeight / 2) || 80;

        // 边界限制改成【游戏画布内】，不是整个屏幕！重要！
        mikuX = Math.max(halfWidth, Math.min(gameContainer.clientWidth - halfWidth, mikuX));
        mikuY = Math.max(halfHeight, Math.min(gameContainer.clientHeight - halfHeight, mikuY));

        miku.style.left = mikuX + 'px';
        miku.style.top = mikuY + 'px';

        requestAnimationFrame(updatePosition);
    }
    updatePosition();

    window.addEventListener('keydown', (e) => {
        const key = e.key.toLowerCase();
        if (keyboardInputs.hasOwnProperty(key)) {
            keyboardInputs[key] = true;
        }
    });

    window.addEventListener('keyup', (e) => {
        const key = e.key.toLowerCase();
        if (keyboardInputs.hasOwnProperty(key)) {
            keyboardInputs[key] = false;
        }
    });

    function resetJoystickVisuals() {
        btnUp.style.backgroundImage = "url('up_01.png.PNG')";
        btnDown.style.backgroundImage = "url('down_01.png.PNG')";
        btnLeft.style.backgroundImage = "url('left_01.png.PNG')";
        btnRight.style.backgroundImage = "url('right_01.png.PNG')";
    }

    function calculateJoystickInput(clientX, clientY) {
        // 把屏幕坐标 → **转换到游戏画布的本地坐标**！不然缩放后摇杆会错位！
        const rectCanvas = gameContainer.getBoundingClientRect();
        const scaleX = gameContainer.clientWidth / rectCanvas.width;
        const scaleY = gameContainer.clientHeight / rectCanvas.height;

        const rectJoy = joyCenter.getBoundingClientRect();
        const centerX = rectJoy.left + (rectJoy.left - rectCanvas.left)*(scaleX-1);
        const centerY = rectJoy.top + (rectJoy.top - rectCanvas.top)*(scaleY-1);

        const deltaX = clientX - centerX;
        const deltaY = clientY - centerY;

        const triggerThreshold = 100;
        const deadZone = 30;

        joystickInputs.w = false;
        joystickInputs.s = false;
        joystickInputs.a = false;
        joystickInputs.d = false;
        resetJoystickVisuals();

        if (Math.abs(deltaX) < deadZone && Math.abs(deltaY) < deadZone) return;

        if (deltaY < -triggerThreshold) {
            joystickInputs.w = true;
            btnUp.style.backgroundImage = "url('up_02.png.PNG')";
        }
        if (deltaY > triggerThreshold) {
            joystickInputs.s = true;
            btnDown.style.backgroundImage = "url('down_02.png.PNG')";
        }
        if (deltaX < -triggerThreshold) {
            joystickInputs.a = true;
            btnLeft.style.backgroundImage = "url('left_02.png.PNG')";
        }
        if (deltaX > triggerThreshold) {
            joystickInputs.d = true;
            btnRight.style.backgroundImage = "url('right_02.png.PNG')";
        }
    }

    function handleJoystickTouch(e) {
        e.preventDefault();
        if (e.touches.length === 0) return;
        calculateJoystickInput(e.touches[0].clientX, e.touches[0].clientY);
    }

    function clearJoystickInput(e) {
        if(e) e.preventDefault();
        isJoystickDragging = false;
        joystickInputs.w = false;
        joystickInputs.s = false;
        joystickInputs.a = false;
        joystickInputs.d = false;
        resetJoystickVisuals();
    }

    joyHitbox.addEventListener('touchstart', handleJoystickTouch, { passive: false });
    joyHitbox.addEventListener('touchmove', handleJoystickTouch, { passive: false });
    joyHitbox.addEventListener('touchend', clearJoystickInput, { passive: false });
    joyHitbox.addEventListener('touchcancel', clearJoystickInput, { passive: false });

    joyHitbox.addEventListener('mousedown', (e) => {
        e.preventDefault();
        isJoystickDragging = true;
        calculateJoystickInput(e.clientX, e.clientY);
    });

    document.addEventListener('mousemove', (e) => {
        if (!isJoystickDragging) return;
        e.preventDefault();
        calculateJoystickInput(e.clientX, e.clientY);
    }, { passive: false });

    document.addEventListener('mouseup', clearJoystickInput);

</script>
</body>
</html>
